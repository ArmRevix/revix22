<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>REVIX RP Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #07080a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .launcher-container {
            width: 920px;
            height: 530px;
            background-color: #0f1118;
            border-radius: 14px;
            display: flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 153, 0, 0.15);
            overflow: hidden;
            border: 1px solid rgba(255, 153, 0, 0.2);
            position: relative;
            transition: opacity 0.5s ease;
        }

        /* Ձախ նավիգացիոն սյունակ */
        .nav-bar {
            width: 70px;
            background-color: #0b0c12;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            justify-content: space-between;
            padding-bottom: 20px;
        }

        .nav-top {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-logo {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #ff9900;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.7);
            background: linear-gradient(135deg, #1f0c02 0%, #0a0b10 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 900;
            color: #ff9900;
        }

        .nav-icon {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #8b93a7;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.3s;
            text-decoration: none;
        }

        .nav-icon:hover, .nav-icon.active {
            background-color: rgba(255, 153, 0, 0.15);
            color: #ff9900;
        }

        /* Սոցիալական կոճակներ նավիգացիոն սյունակի ներքևում */
        .social-icons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .social-btn:hover {
            transform: scale(1.08);
        }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2, #4752C4);
        }

        .youtube-btn {
            background: linear-gradient(135deg, #FF0000, #CC0000);
        }

        /* Ձախ մենյու */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #131622 0%, #0d0e17 100%);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            color: #ff9900;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .version-text {
            font-size: 11px;
            color: #6c757d;
            font-weight: 600;
            margin-top: 2px;
        }

        .input-group label {
            font-size: 11px;
            color: #8b93a7;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #0a0b10;
            border: 1px solid #232838;
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .server-list h3 {
            font-size: 12px;
            color: #8b93a7;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .server-card {
            background: rgba(10, 11, 16, 0.7);
            padding: 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #ff9900;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
        }

        .server-num {
            font-weight: 800;
            color: #ff9900;
            font-size: 15px;
        }

        .online {
            font-size: 12px;
            color: #2ecc71;
            font-weight: 700;
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .action-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1e6b9e, #2980b9);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 18px rgba(41, 128, 185, 0.4);
            transition: all 0.3s ease;
        }

        .action-button.ready {
            background: linear-gradient(135deg, #ff9900, #ff6600);
            box-shadow: 0 5px 20px rgba(255, 153, 0, 0.5);
        }

        .main-content {
            flex: 1;
            background: linear-gradient(180deg, rgba(15, 17, 24, 0.3) 0%, rgba(15, 17, 24, 0.85) 100%), 
                        url('https://images.wallpaperscraft.com/image/single/city_night_street_139982_1280x720.jpg') center/cover no-repeat;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }

        .page {
            display: none;
            height: 100%;
            flex-direction: column;
            justify-content: flex-end;
        }

        .page.active {
            display: flex;
        }

        .news-banner h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #fff;
        }

        /* Գրաֆիկայի ընտրության ոճերը կարգավորումների էջում */
        .settings-content h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff9900;
        }

        .graphics-options {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .gfx-btn {
            flex: 1;
            padding: 12px;
            background: rgba(10, 11, 16, 0.8);
            border: 2px solid #232838;
            border-radius: 8px;
            color: #8b93a7;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .gfx-btn.active, .gfx-btn:hover {
            border-color: #ff9900;
            color: #fff;
            background: rgba(255, 153, 0, 0.15);
        }

        .progress-container {
            background: rgba(13, 14, 22, 0.85);
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9900, #ff5500);
            border-radius: 5px;
            transition: width 0.3s;
        }

        #statusText {
            font-size: 12px;
            color: #a0a7ba;
            font-weight: 600;
        }

        /* Բեռնման էկրանը հենց քո նկարով */
        #spring-loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://res.cloudinary.com/ptklpvoe/image/upload/f_auto,q_auto/1790') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 50px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 99999;
        }

        #spring-loading-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spring-loader-container {
            width: 75%;
            max-width: 420px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .spring-loader-bar-bg {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .spring-loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6600, #ffcc00);
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .spring-loader-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="launcherContainer" class="launcher-container">
        <!-- Ձախ նավիգացիոն սյունակ -->
        <div class="nav-bar">
            <div class="nav-top">
                <div class="nav-logo">R</div>
                <div id="homeNavBtn" class="nav-icon active" title="Главная">🏠</div>
                <div id="settingsNavBtn" class="nav-icon" title="Настройки графики">⚙️</div>
            </div>
            <div class="social-icons">
                <a href="https://discord.gg/u6NAar7j2" target="_blank" class="social-btn discord-btn" title="Discord">💬</a>
                <a href="https://www.youtube.com/@armrevix" target="_blank" class="social-btn youtube-btn" title="YouTube">▶</a>
            </div>
        </div>

        <div class="sidebar">
            <div class="logo-area">
                <h1 class="logo">REVIX RP</h1>
                <span class="version-text">Version 1.0.0</span>
            </div>
            
            <div class="input-group">
                <label for="nickname">ВАШ НИКНЕЙМ</label>
                <input type="text" id="nickname" placeholder="Name_Surname">
            </div>

            <div class="server-list">
                <h3>СЕРВЕРЫ</h3>
                <div class="server-card">
                    <div class="server-info">
                        <div class="live-dot"></div>
                        <span class="server-num">01</span>
                    </div>
                    <span id="onlineCount" class="online">0/1000</span>
                </div>
            </div>

            <button id="mainBtn" class="action-button">СКАЧАТЬ</button>
        </div>

        <div class="main-content">
            <!-- Գլխավոր էջ -->
            <div id="homePage" class="page active">
                <div class="news-banner">
                    <h2>ДОБРО ПОЖАЛОВАТЬ НА REVIX RP</h2>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <span id="statusText">Готов к загрузке</span>
                </div>
            </div>

            <!-- Կարգավորումների (Գրաֆիկայի) էջ -->
            <div id="settingsPage" class="page">
                <div class="settings-content">
                    <h2>НАСТРОЙКА ГРАФИКИ</h2>
                    <p style="color: #a0a7ba; font-size: 13px; margin-bottom: 10px;">Выберите качество графики для игры:</p>
                    <div class="graphics-options">
                        <div class="gfx-btn" data-gfx="low">Слабая</div>
                        <div class="gfx-btn active" data-gfx="medium">Средняя</div>
                        <div class="gfx-btn" data-gfx="high">Ультра</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Բեռնման էկրանը -->
    <div id="spring-loading-screen">
        <div class="spring-loader-container">
            <div class="spring-loader-bar-bg">
                <div class="spring-loader-bar" id="springLoaderBar"></div>
            </div>
            <div class="spring-loader-text" id="springLoaderText">Загрузка весеннего обновления... 0%</div>
        </div>
    </div>

    <script>
        const mainBtn = document.getElementById('mainBtn');
        const nicknameInput = document.getElementById('nickname');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const onlineCount = document.getElementById('onlineCount');
        const launcherContainer = document.getElementById('launcherContainer');

        const homeNavBtn = document.getElementById('homeNavBtn');
        const settingsNavBtn = document.getElementById('settingsNavBtn');
        const homePage = document.getElementById('homePage');
        const settingsPage = document.getElementById('settingsPage');

        const gfxBtns = document.querySelectorAll('.gfx-btn');

        const springLoadingScreen = document.getElementById('spring-loading-screen');
        const springLoaderBar = document.getElementById('springLoaderBar');
        const springLoaderText = document.getElementById('springLoaderText');

        let isDownloaded = false; 
        let currentOnline = 0; 
        let isInGame = false;    

        // Նավիգացիոն կոճակների փոխարկում (Գլխավոր / Կարգավորումներ)
        homeNavBtn.addEventListener('click', () => {
            homeNavBtn.classList.add('active');
            settingsNavBtn.classList.remove('active');
            homePage.classList.add('active');
            settingsPage.classList.remove('active');
        });

        settingsNavBtn.addEventListener('click', () => {
            settingsNavBtn.classList.add('active');
            homeNavBtn.classList.remove('active');
            settingsPage.classList.add('active');
            homePage.classList.remove('active');
        });

        // Գրաֆիկայի կոճակների ընտրություն
        gfxBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                gfxBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        mainBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();

            if (!isDownloaded) {
                mainBtn.disabled = true;
                statusText.innerText = 'Загрузка файлов игры... 0%';
                
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    progressBar.style.width = progress + '%';
                    statusText.innerText = 'Загрузка файлов игры... ' + progress + '%';

                    if (progress >= 100) {
                        clearInterval(interval);
                        isDownloaded = true;
                        
                        mainBtn.innerText = 'ИГРАТЬ';
                        mainBtn.classList.add('ready');
                        mainBtn.disabled = false;
                        statusText.innerText = 'Готов к игре';
                    }
                }, 300);

            } else {
                const cleanRegex = /^[A-Za-z]+_[A-Za-z]+$/;

                if (!nickname || !cleanRegex.test(nickname)) {
                    nicknameInput.classList.add('error');
                    nicknameInput.value = '';
                    nicknameInput.placeholder = 'Format: Name_Surname';
                    nicknameInput.focus();
                    return;
                }

                if (!isInGame) {
                    isInGame = true;
                    currentOnline += 1;
                    onlineCount.innerText = currentOnline + '/1000';

                    // 1. Թաքցնում ենք լաունչերը
                    launcherContainer.style.opacity = '0';
                    setTimeout(() => {
                        launcherContainer.style.display = 'none';
                    }, 500);

                    // 2. Միացնում ենք բեռնման էկրանը
                    springLoadingScreen.classList.add('active');

                    let springProgress = 0;
                    const totalTime = 12000; // 12 վարկյան
                    const intervalTime = 100;
                    const increment = (intervalTime / totalTime) * 100;

                    const springInterval = setInterval(() => {
                        springProgress += increment;

                        if (springProgress >= 100) {
                            springProgress = 100;
                            clearInterval(springInterval);
                            springLoaderText.innerText = 'Загрузка завершена! Вход в игру...';
                            
                            setTimeout(() => {
                                alert('Добро пожаловать в игру, ' + nickname + '!');
                            }, 500);
                        }

                        springLoaderBar.style.width = springProgress + '%';
                        springLoaderText.innerText = `Загрузка весеннего обновления... ${Math.floor(springProgress)}%`;
                    }, intervalTime);
                }
            }
        });
    </script>
</body>
                          </html>
