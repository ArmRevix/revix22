<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>REVIX RP Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #07080a; color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .launcher-container { width: 920px; height: 530px; background-color: #0f1118; border-radius: 14px; display: flex; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid rgba(255,153,0,0.2); position: relative; transition: opacity 0.5s ease; z-index: 10; }
        .nav-bar { width: 70px; background-color: #0b0c12; display: flex; flex-direction: column; align-items: center; padding-top: 15px; border-right: 1px solid rgba(255,255,255,0.05); justify-content: space-between; padding-bottom: 20px; }
        .nav-top { display: flex; flex-direction: column; align-items: center; }
        .nav-logo { width: 46px; height: 46px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #ff9900; background: linear-gradient(135deg, #1f0c02 0%, #0a0b10 100%); display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 900; color: #ff9900; }
        .nav-icon { width: 45px; height: 45px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #8b93a7; cursor: pointer; margin-bottom: 12px; transition: all 0.3s; text-decoration: none; }
        .nav-icon:hover, .nav-icon.active { background-color: rgba(255,153,0,0.15); color: #ff9900; }
        .social-icons { display: flex; flex-direction: column; gap: 8px; }
        .social-btn { width: 42px; height: 42px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; text-decoration: none; }
        .discord-btn { background: #5865F2; }
        .youtube-btn { background: #FF0000; }
        .sidebar { width: 260px; background: #131622; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; }
        .logo { font-size: 24px; color: #ff9900; font-weight: 900; letter-spacing: 2px; }
        .version-text { font-size: 11px; color: #6c757d; font-weight: 600; }
        .input-group label { font-size: 11px; color: #8b93a7; display: block; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; background-color: #0a0b10; border: 1px solid #232838; border-radius: 8px; color: white; font-size: 13px; outline: none; }
        .input-group input.error { border-color: #e74c3c; }
        .server-card { background: rgba(10,11,16,0.7); padding: 14px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid #ff9900; }
        .live-dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; }
        .server-num { font-weight: 800; color: #ff9900; font-size: 15px; }
        .online { font-size: 12px; color: #2ecc71; font-weight: 700; background: rgba(46,204,113,0.1); padding: 4px 8px; border-radius: 6px; }
        .action-button { width: 100%; padding: 15px; background: #2980b9; border: none; border-radius: 8px; color: white; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .action-button.ready { background: #ff9900; }
        .action-button.update { background: #e67e22; }
        .main-content { flex: 1; background: url('https://images.wallpaperscraft.com/image/single/city_night_street_139982_1280x720.jpg') center/cover no-repeat; padding: 35px; display: flex; flex-direction: column; justify-content: flex-end; position: relative; }
        .page { display: none; height: 100%; flex-direction: column; justify-content: flex-end; }
        .page.active { display: flex; }
        .news-banner h2 { font-size: 24px; font-weight: 800; margin-bottom: 18px; color: #fff; }
        .settings-content h2 { font-size: 22px; margin-bottom: 15px; color: #ff9900; }
        .graphics-options { display: flex; gap: 12px; margin-top: 10px; }
        .gfx-btn { flex: 1; padding: 12px; background: rgba(10,11,16,0.8); border: 2px solid #232838; border-radius: 8px; color: #8b93a7; font-weight: 700; cursor: pointer; text-align: center; }
        .gfx-btn.active, .gfx-btn:hover { border-color: #ff9900; color: #fff; background: rgba(255,153,0,0.15); }
        .progress-container { background: rgba(13,14,22,0.85); padding: 14px 18px; border-radius: 10px; }
        .progress-bar-bg { width: 100%; height: 10px; background-color: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { width: 0%; height: 100%; background: #ff9900; border-radius: 5px; transition: width 0.3s; }
        #statusText { font-size: 12px; color: #a0a7ba; font-weight: 600; }
        
        #spring-loading-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('https://res.cloudinary.com/ptklpvoe/image/upload/f_auto,q_auto/1790') center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 50px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 20; }
        #spring-loading-screen.active { opacity: 1; pointer-events: auto; }
        .spring-loader-container { width: 75%; max-width: 420px; background: rgba(0,0,0,0.85); border-radius: 12px; padding: 10px 15px; border: 1px solid rgba(255,255,255,0.3); }
        .spring-loader-bar-bg { width: 100%; height: 12px; background-color: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .spring-loader-bar { height: 100%; width: 0%; background: #ff6600; border-radius: 6px; }
        .spring-loader-text { color: #ffffff; font-size: 14px; font-weight: bold; text-align: center; margin-top: 8px; }
        
        #register-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('https://res.cloudinary.com/ptklpvoe/image/upload/f_auto,q_auto/1899') center/cover no-repeat; display: flex; justify-content: flex-start; align-items: flex-end; padding-left: 80px; padding-bottom: 60px; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #register-modal.active { opacity: 1; pointer-events: auto; }

        #login-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: url('https://i.postimg.cc/VkvHg2LH/file-00000000424c81f4bc5a70d4c2d8e337.png') center/cover no-repeat; display: flex; justify-content: flex-start; align-items: flex-end; padding-left: 80px; padding-bottom: 60px; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        #login-modal.active { opacity: 1; pointer-events: auto; }
        
        .radmir-auth-box { width: 340px; background: rgba(15, 17, 24, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255, 153, 0, 0.3); border-radius: 10px; padding: 22px; box-shadow: 0 20px 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 12px; }
        .radmir-title-area { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 2px; }
        .radmir-title-area span { color: #ff9900; font-size: 15px; font-weight: bold; text-transform: uppercase; }
        .radmir-field label { font-size: 11px; color: #a0a7ba; display: block; margin-bottom: 4px; font-weight: 600; }
        .radmir-field input { width: 100%; padding: 9px; background: rgba(10, 11, 16, 0.95); border: 1px solid #232838; border-radius: 6px; color: white; font-size: 13px; outline: none; }
        .radmir-field input:focus { border-color: #ff9900; }
        .radmir-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, #ff9900, #ff6600); border: none; border-radius: 6px; color: white; font-size: 13px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 4px; box-shadow: 0 4px 12px rgba(255,153,0,0.4); }
    </style>
</head>
<body>
    <div id="launcherContainer" class="launcher-container">
        <div class="nav-bar">
            <div class="nav-top">
                <div class="nav-logo">R</div>
                <div id="homeNavBtn" class="nav-icon active" title="Главная">🏠</div>
                <div id="settingsNavBtn" class="nav-icon" title="Настройки графики">⚙️</div>
            </div>
            <div class="social-icons">
                <a href="https://discord.gg/u6NAar7j2" target="_blank" class="social-btn discord-btn" title="Discord">💬</a>
                <a href="https://www.youtube.com/@armrevix" target="_blank" class="social-btn youtube-btn" title="YouTube">▶</a>
            </div>
        </div>

        <div class="sidebar">
            <div class="logo-area">
                <h1 class="logo">REVIX RP</h1>
                <span id="versionText" class="version-text">Version 1.0.0</span>
            </div>
            <div class="input-group">
                <label for="nickname">ВАШ НИКНЕЙМ</label>
                <input type="text" id="nickname" placeholder="Name_Surname">
            </div>
            <div class="server-list">
                <h3>СЕРВЕРЫ</h3>
                <div class="server-card">
                    <div class="server-info">
                        <div class="live-dot"></div>
                        <span class="server-num">01</span>
                    </div>
                    <span id="onlineCount" class="online">0/1000</span>
                </div>
            </div>
            <button id="mainBtn" class="action-button">СКАЧАТЬ</button>
        </div>

        <div class="main-content">
            <div id="homePage" class="page active">
                <div class="news-banner">
                    <h2>ДОБРО ПОЖАЛОВАТЬ НА REVIX RP</h2>
                </div>
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <span id="statusText">Готов к загрузке</span>
                </div>
            </div>

            <div id="settingsPage" class="page">
                <div class="settings-content">
                    <h2>НАСТРОЙКА ГРАФИКИ</h2>
                    <p style="color: #a0a7ba; font-size: 13px; margin-bottom: 10px;">Выберите качество графики для игры:</p>
                    <div class="graphics-options">
                        <div class="gfx-btn" data-gfx="low">Слабая</div>
                        <div class="gfx-btn active" data-gfx="medium">Средняя</div>
                        <div class="gfx-btn" data-gfx="high">Ультра</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="spring-loading-screen">
        <div class="spring-loader-container">
            <div class="spring-loader-bar-bg">
                <div class="spring-loader-bar" id="springLoaderBar"></div>
            </div>
            <div class="spring-loader-text" id="springLoaderText">Загрузка весеннего обновления... 0%</div>
        </div>
    </div>

    <div id="register-modal" class="modal-screen">
        <div class="radmir-auth-box">
            <div class="radmir-title-area">
                <span>👤 Регистрация</span>
            </div>
            <div class="radmir-field">
                <label>Gmail адрес</label>
                <input type="email" id="regEmail" placeholder="example@gmail.com">
            </div>
            <div class="radmir-field">
                <label>Пароль</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <div class="radmir-field">
                <label>Повторите пароль</label>
                <input type="password" id="regPassConfirm" placeholder="••••••••">
            </div>
            <button id="regSubmitBtn" class="radmir-btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </div>
    </div>

    <div id="login-modal" class="modal-screen">
        <div class="radmir-auth-box">
            <div class="radmir-title-area">
                <span>🔑 Авторизация</span>
            </div>
            <div class="radmir-field">
                <label>Введите пароль</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button id="loginSubmitBtn" class="radmir-btn">ВОЙТИ В ИГРУ</button>
        </div>
    </div>
    <script>
        const CURRENT_VERSION = '1.0.0';

        const mainBtn = document.getElementById('mainBtn');
        const nicknameInput = document.getElementById('nickname');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const onlineCount = document.getElementById('onlineCount');
        const launcherContainer = document.getElementById('launcherContainer');
        const versionText = document.getElementById('versionText');

        const homeNavBtn = document.getElementById('homeNavBtn');
        const settingsNavBtn = document.getElementById('settingsNavBtn');
        const homePage = document.getElementById('homePage');
        const settingsPage = document.getElementById('settingsPage');
        const gfxBtns = document.querySelectorAll('.gfx-btn');

        const springLoadingScreen = document.getElementById('spring-loading-screen');
        const springLoaderBar = document.getElementById('springLoaderBar');
        const springLoaderText = document.getElementById('springLoaderText');

        const registerModal = document.getElementById('register-modal');
        const regEmail = document.getElementById('regEmail');
        const regPass = document.getElementById('regPass');
        const regPassConfirm = document.getElementById('regPassConfirm');
        const regSubmitBtn = document.getElementById('regSubmitBtn');

        const loginModal = document.getElementById('login-modal');
        const loginPass = document.getElementById('loginPass');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');

        let currentOnline = 0; 
        let savedNickname = '';

        versionText.innerText = 'Version ' + CURRENT_VERSION;

        // ԱՎՏՈՄԱՏ ՎԵՐԱԿԱՆԳՆՈՒՄ ԵՆՔ ՊԱՀՊԱՆՎԱԾ ՆԻԿԸ
        const savedNick = localStorage.getItem('revix_last_nickname');
        if (savedNick) {
            nicknameInput.value = savedNick;
            savedNickname = savedNick;
        }

        const savedVersion = localStorage.getItem('revix_installed_version');

        if (!savedVersion) {
            mainBtn.innerText = 'СКАЧАТЬ';
            mainBtn.classList.remove('ready', 'update');
        } else if (savedVersion !== CURRENT_VERSION) {
            mainBtn.innerText = 'ОБНОВИТЬ';
            mainBtn.classList.add('update');
            mainBtn.classList.remove('ready');
        } else {
            mainBtn.innerText = 'ИГРАТЬ';
            mainBtn.classList.add('ready');
            mainBtn.classList.remove('update');
        }

        homeNavBtn.addEventListener('click', () => {
            homeNavBtn.classList.add('active');
            settingsNavBtn.classList.remove('active');
            homePage.classList.add('active');
            settingsPage.classList.remove('active');
        });

        settingsNavBtn.addEventListener('click', () => {
            settingsNavBtn.classList.add('active');
            homeNavBtn.classList.remove('active');
            settingsPage.classList.add('active');
            homePage.classList.remove('active');
        });

        gfxBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                gfxBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        nicknameInput.addEventListener('input', () => {
            nicknameInput.classList.remove('error');
        });

        mainBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();

            const nickRegex = /^[A-Z][a-z]+_[A-Z][a-z]+$/;
            if (!nickname || !nickRegex.test(nickname)) {
                nicknameInput.classList.add('error');
                nicknameInput.value = '';
                nicknameInput.placeholder = 'Format: Name_Surname';
                nicknameInput.focus();
                return;
            }

            savedNickname = nickname;
            // ՀԻՇՈՒՄ ԵՆՔ ՆԻԿԸ ՀԵՌԱԽՈՍԻ ՀԻՇՈՂՈՒԹՅԱՆ ՄԵՋ (ՄՆՈՒՄ Է ԱՆՓՈՓՈԽ)
            localStorage.setItem('revix_last_nickname', nickname);

            const btnState = mainBtn.innerText;

            if (btnState === 'СКАЧАТЬ' || btnState === 'ОБНОВИТЬ') {
                mainBtn.disabled = true;
                statusText.innerText = btnState === 'СКАЧАТЬ' ? 'Загрузка файлов игры... 0%' : 'Установка обновления... 0%';
                
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    progressBar.style.width = progress + '%';
                    statusText.innerText = (btnState === 'СКАЧАТЬ' ? 'Загрузка файлов игры... ' : 'Установка обновления... ') + progress + '%';

                    if (progress >= 100) {
                        clearInterval(interval);
                        localStorage.setItem('revix_installed_version', CURRENT_VERSION);
                        
                        mainBtn.innerText = 'ИГРАТЬ';
                        mainBtn.classList.remove('update');
                        mainBtn.classList.add('ready');
                        mainBtn.disabled = false;
                        statusText.innerText = 'Готов к игре';
                    }
                }, 150);

            } else {
                launcherContainer.style.opacity = '0';
                setTimeout(() => {
                    launcherContainer.style.display = 'none';
                    springLoadingScreen.style.display = 'flex';
                    springLoadingScreen.classList.add('active');
                }, 500);

                let p = 0;

                function step1() {
                    const t1 = setInterval(() => {
                        p += 2;
                        if (p >= 20) {
                            p = 20;
                            clearInterval(t1);
                            springLoaderBar.style.width = p + '%';
                            springLoaderText.innerText = `Загрузка весеннего обновления... ${p}%`;
                            setTimeout(step2, 1000);
                            return;
                        }
                        springLoaderBar.style.width = p + '%';
                        springLoaderText.innerText = `Загрузка весеннего обновления... ${p}%`;
                    }, 50);
                }

                function step2() {
                    const t2 = setInterval(() => {
                        p += 2;
                        if (p >= 75) {
                            p = 75;
                            clearInterval(t2);
                            springLoaderBar.style.width = p + '%';
                            springLoaderText.innerText = `Загрузка весеннего обновления... ${p}%`;
                            setTimeout(step3, 2000);
                            return;
                        }
                        springLoaderBar.style.width = p + '%';
                        springLoaderText.innerText = `Загрузка весеннего обновления... ${p}%`;
                    }, 50);
                }

                function step3() {
                    const t3 = setInterval(() => {
                        p += 1;
                        if (p >= 90) {
                            p = 90;
                            clearInterval(t3);
                            springLoaderBar.style.width = p + '%';
                                 setTimeout(() => { launcherContainer.style.opacity = '1'; }, 50);
            
            // ՄԱՔՐՄԱՆ ԺԱՄԱՆԱԿ ՆԻԿԸ ՉԵՆՔ ՋՆՋՈՒՄ, ԱՅԼ ՎԵՐԱԿԱՆԳՆՈՒՄ ԵՆՔ ՀԻՇՈՂՈՒԹՅՈՒՆԻՑ
            const currentSavedNick = localStorage.getItem('revix_last_nickname');
            if (currentSavedNick) {
                nicknameInput.value = currentSavedNick;
            }

            regEmail.value = '';
            regPass.value = '';
            regPassConfirm.value = '';
            loginPass.value = '';
            
            mainBtn.innerText = 'ИГРАТЬ';
            mainBtn.classList.add('ready');
            mainBtn.classList.remove('update');
        }
    </script>
</body>
</html>
